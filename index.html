<body class="bg-[#070b14] text-slate-100 min-h-screen">
  <div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col justify-between pb-20"></div>

  <script>
    // =========================================================================
    // DKWIN Complete Persistent State (Synced in localStorage for Web/Vercel)
    // =========================================================================
    const STORAGE_KEY = "dkwin_full_platform_v2";

    const defaultState = {
      currentUserId: null,
      isAdminLoggedIn: false,
      activeTab: window.location.pathname === "/admin" ? "admin" : "home", // home, activity, wallet, promo, mine, admin
      activeGame: null, // null, wingo, crash, thimbles, slots, sports, mines
      selectedCategory: "all",
      selectedWingoTimer: "1m",
      selectedCrashVariant: "aviator",
      selectedSlotId: "jili_super_ace",
      multiBetSlip: [],
      settings: {
        bkashNumber: "01788223344",
        bkashRule: "সেন্ড মানি (Send Money)",
        nagadNumber: "01899112233",
        nagadRule: "ক্যাশ আউট (Cash Out)",
        rocketNumber: "01955443322",
        rocketRule: "সেন্ড মানি (Send Money)",
        upayNumber: "01622334455",
        upayRule: "ক্যাশ আউট (Cash Out)",
        depositRulesText: "১. উপরে প্রদর্শিত নাম্বার কপি করুন।\n২. নির্ধারিত নিয়ম অনুযায়ী (Send Money অথবা Cash Out) টাকা পাঠান।\n৩. টাকা পাঠানোর পর সঠিক TrxID ও আপনার প্রেরক নাম্বার দিয়ে সাবমিট করুন।",
        pendingProcessingNotice: "আপনার ব্যালেন্স পেতে ২ মিনিট থেকে সর্বোচ্চ ১০ মিনিট সময় লাগতে পারে। এডমিন যাচাই করে অনুমোদন করা মাত্রই ব্যালেন্স যুক্ত হবে।",
        minDeposit: 50,
        minWithdraw: 100,
        minBet: 1,
        depositBonusPercent: 5,
        referralDepositCommissionPercent: 3,
        referralBetCommissionPercent: 1,
        referralFixedBonus: 25,
        wingoFeePercent: 2,
        telegramSupportUsername: "@DKWIN_Official_Support",
        adminPin: "admin1234",
        siteNotice: "DKWIN অফিশিয়াল গেমিং প্ল্যাটফর্মে স্বাগতম! সর্বনিম্ন ডিপোজিট ৫০ টাকা এবং সর্বনিম্ন বেট মাত্র ১ টাকা। বিকাশ ও নগদে দ্রুত পেমেন্ট!",
        forcedWingoMode: "AUTO_BALANCED", // AUTO_BALANCED, FORCE_BIG, FORCE_SMALL, FORCE_GREEN, FORCE_RED, FORCE_VIOLET, FORCE_NUMBER
        forcedWingoNumber: -1,
        forcedCrashMode: "AUTO", // AUTO, FORCE_CRASH
        forcedCrashMultiplier: 1.80,
        thimblesWinRatePercent: 45,
        slotsWinRatePercent: 45
      },
      users: [],
      transactions: [],
      gameBets: [],
      wingoHistory: [
        { periodNumber: "202610200101", timerType: "1m", winningNumber: 7, winningColor: "green", winningSize: "big" },
        { periodNumber: "202610200100", timerType: "1m", winningNumber: 2, winningColor: "red", winningSize: "small" },
        { periodNumber: "202610200099", timerType: "1m", winningNumber: 5, winningColor: "green_violet", winningSize: "big" },
        { periodNumber: "202610200098", timerType: "1m", winningNumber: 0, winningColor: "red_violet", winningSize: "small" },
        { periodNumber: "202610200097", timerType: "1m", winningNumber: 8, winningColor: "red", winningSize: "big" }
      ],
      sportsMatches: [
        { id: 1, sport: "cricket", tournament: "BPL T20 Bangladesh", teamA: "Comilla Victorians", teamB: "Fortune Barishal", oddsA: 1.85, oddsDraw: 12.0, oddsB: 1.98, runsLine: "172.5 Runs", overOdds: 1.88, underOdds: 1.88, score: "142/3 (15.4 ov)", status: "live" },
        { id: 2, sport: "cricket", tournament: "ICC Champions Trophy", teamA: "Bangladesh", teamB: "India", oddsA: 2.65, oddsDraw: 15.0, oddsB: 1.52, runsLine: "285.5 Runs", overOdds: 1.90, underOdds: 1.85, score: "198/4 (34.2 ov)", status: "live" },
        { id: 3, sport: "cricket", tournament: "IPL T20 Official", teamA: "Chennai Super Kings", teamB: "Mumbai Indians", oddsA: 1.90, oddsDraw: 14.0, oddsB: 1.92, runsLine: "188.5 Runs", overOdds: 1.87, underOdds: 1.87, score: "Starts 8:00 PM", status: "upcoming" },
        { id: 4, sport: "football", tournament: "UEFA Champions League", teamA: "Real Madrid", teamB: "Manchester City", oddsA: 2.25, oddsDraw: 3.40, oddsB: 2.90, runsLine: "2.5 Goals", overOdds: 1.75, underOdds: 2.05, score: "1 - 1 (62')", status: "live" }
      ],
      giftCodes: [
        { id: 1, code: "DKWIN2026", amount: 50, maxClaims: 500, claimsCount: 0 },
        { id: 2, code: "WELCOME100", amount: 100, maxClaims: 200, claimsCount: 0 }
      ],
      chatMessages: [
        { id: 1, username: "DKWIN অফিশিয়াল সাপোর্ট", message: "আসসালামু আলাইকুম! DKWIN ২৪/৭ লাইভ কাস্টমার সাপোর্টে স্বাগতম। যেকোনো সাহায্যের জন্য এখানে মেসেজ দিন অথবা আমাদের অফিসিয়াল টেলিগ্রামে যোগাযোগ করুন।", isSupport: true }
      ]
    };

    let state = loadState();
    let modalType = null; // null, 'auth', 'deposit', 'withdraw', 'chat'
    let toastMsg = null;
    let wingoRemaining = 60;
    let wingoPeriod = "";
    let lastSettledPeriodByTimer = {};

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...defaultState, ...parsed, settings: { ...defaultState.settings, ...(parsed.settings || {}) } };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(text, isError = false) {
      toastMsg = { text, isError };
      render();
      setTimeout(() => {
        toastMsg = null;
        render();
      }, 3200);
    }

    function getCurrentUser() {
      return state.users.find(u => u.id === state.currentUserId) || null;
    }

    function getTimerSeconds(t) {
      if (t === "30s") return 30;
      if (t === "3m") return 180;
      if (t === "5m") return 300;
      return 60;
    }

    function getColorForNumber(n) {
      if (n === 0) return "red_violet";
      if (n === 5) return "green_violet";
      return [1, 3, 7, 9].includes(n) ? "green" : "red";
    }

    function calcWingoPayout(pred, netStake, winNum) {
      const winSize = winNum >= 5 ? "big" : "small";
      if (pred === "big") return winSize === "big" ? [netStake * 2, 2] : [0, 0];
      if (pred === "small") return winSize === "small" ? [netStake * 2, 2] : [0, 0];
      if (pred === "green") {
        if ([1, 3, 7, 9].includes(winNum)) return [netStake * 2, 2];
        if (winNum === 5) return [netStake * 1.5, 1.5];
        return [0, 0];
      }
      if (pred === "red") {
        if ([2, 4, 6, 8].includes(winNum)) return [netStake * 2, 2];
        if (winNum === 0) return [netStake * 1.5, 1.5];
        return [0, 0];
      }
      if (pred === "violet") {
        return [0, 5].includes(winNum) ? [netStake * 4.5, 4.5] : [0, 0];
      }
      const num = parseInt(pred, 10);
      if (!isNaN(num) && num === winNum) return [netStake * 9, 9];
      return [0, 0];
    }

    function settleWingoPeriod(periodStr, timerType) {
      const pending = state.gameBets.filter(b => b.gameType === "wingo" && b.status === "pending" && b.periodNumber === periodStr);
      const s = state.settings;
      let winNum = Math.floor(Math.random() * 10);

      if (s.forcedWingoMode === "FORCE_NUMBER" && s.forcedWingoNumber >= 0 && s.forcedWingoNumber <= 9) {
        winNum = s.forcedWingoNumber;
      } else if (s.forcedWingoMode === "FORCE_BIG") {
        winNum = [5, 6, 7, 8, 9][Math.floor(Math.random() * 5)];
      } else if (s.forcedWingoMode === "FORCE_SMALL") {
        winNum = [0, 1, 2, 3, 4][Math.floor(Math.random() * 5)];
      } else if (s.forcedWingoMode === "FORCE_GREEN") {
        winNum = [1, 3, 5, 7, 9][Math.floor(Math.random() * 5)];
      } else if (s.forcedWingoMode === "FORCE_RED") {
        winNum = [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
      } else if (s.forcedWingoMode === "FORCE_VIOLET") {
        winNum = [0, 5][Math.floor(Math.random() * 2)];
      } else if (pending.length > 0) {
        // AUTO_BALANCED: pick lowest payout number 75% of the time
        let payouts = [];
        for (let c = 0; c <= 9; c++) {
          let totalPay = 0;
          pending.forEach(b => { totalPay += calcWingoPayout(b.prediction, b.netStake, c)[0]; });
          payouts.push({ num: c, pay: totalPay });
        }
        payouts.sort((a, b) => a.pay - b.pay);
        winNum = payouts[0].num;
      }

      const winColor = getColorForNumber(winNum);
      const winSize = winNum >= 5 ? "big" : "small";

      pending.forEach(bet => {
        const [pay, mult] = calcWingoPayout(bet.prediction, bet.netStake, winNum);
        bet.status = "settled";
        bet.isWin = pay > 0;
        bet.winAmount = pay;
        bet.multiplier = mult;
        bet.outcome = `${winNum} (${winSize.toUpperCase()} / ${winColor.toUpperCase()})`;
        if (pay > 0) {
          const u = state.users.find(x => x.id === bet.userId);
          if (u) {
            u.balance += pay;
            u.totalWinAmount = (u.totalWinAmount || 0) + pay;
          }
        }
      });

      state.wingoHistory.unshift({
        periodNumber: periodStr,
        timerType,
        winningNumber: winNum,
        winningColor: winColor,
        winningSize: winSize
      });
      if (state.wingoHistory.length > 35) state.wingoHistory.pop();
      saveState();
    }

    // Global 1s synchronized timer loop
    setInterval(() => {
      const nowSec = Math.floor(Date.now() / 1000);
      const dur = getTimerSeconds(state.selectedWingoTimer);
      const slot = Math.floor(nowSec / dur) % 10000;
      const d = new Date();
      const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      const curPeriod = `${dateStr}${String(slot).padStart(4, "0")}`;
      const rem = dur - (nowSec % dur);

      const prevPeriod = lastSettledPeriodByTimer[state.selectedWingoTimer];
      if (prevPeriod && prevPeriod !== curPeriod) {
        settleWingoPeriod(prevPeriod, state.selectedWingoTimer);
      }
      lastSettledPeriodByTimer[state.selectedWingoTimer] = curPeriod;
      wingoPeriod = curPeriod;
      wingoRemaining = rem;

      const timerEl = document.getElementById("wingo-live-timer");
      const periodEl = document.getElementById("wingo-live-period");
      if (timerEl) {
        const m = String(Math.floor(rem / 60)).padStart(2, "0");
        const s = String(rem % 60).padStart(2, "0");
        timerEl.textContent = `${m}:${s}`;
      }
      if (periodEl) {
        periodEl.textContent = curPeriod;
      }
    }, 1000);

    // =========================================================================
    // Actions
    // =========================================================================
    window.dkAction = {
      setTab(tab) {
        state.activeGame = null;
        state.activeTab = tab;
        saveState();
        render();
      },
      openGame(game, subId) {
        state.activeGame = game;
        if (game === "crash" && subId) state.selectedCrashVariant = subId;
        if (game === "slots" && subId) state.selectedSlotId = subId;
        saveState();
        render();
      },
      setCategory(cat) {
        state.selectedCategory = cat;
        render();
      },
      setWingoTimer(t) {
        state.selectedWingoTimer = t;
        saveState();
        render();
      },
      openModal(m) {
        if ((m === "deposit" || m === "withdraw") && !getCurrentUser()) {
          modalType = "auth";
          showToast("প্রথমে আপনার একাউন্টে লগইন বা রেজিস্টার করুন!", true);
          return;
        }
        modalType = m;
        render();
      },
      closeModal() {
        modalType = null;
        render();
      },
      registerUser() {
        const username = document.getElementById("reg-username")?.value?.trim() || "";
        const phone = document.getElementById("reg-phone")?.value?.trim() || "";
        const password = document.getElementById("reg-pass")?.value?.trim() || "";
        const refCode = document.getElementById("reg-ref")?.value?.trim()?.toUpperCase() || "";

        if (username.length < 3 || phone.length < 11 || password.length < 4) {
          showToast("সঠিক ইউজারনেম, ১১ ডিজিটের মোবাইল নাম্বার এবং পাসওয়ার্ড দিন!", true);
          return;
        }
        if (state.users.some(u => u.phone === phone || u.username.toLowerCase() === username.toLowerCase())) {
          showToast("এই নাম্বার বা ইউজারনেম দিয়ে ইতিমধ্যে একাউন্ট আছে!", true);
          return;
        }

        let validRef = null;
        if (refCode) {
          const referrer = state.users.find(u => u.inviteCode === refCode);
          if (referrer) {
            validRef = refCode;
            const bonus = Number(state.settings.referralFixedBonus) || 0;
            if (bonus > 0) {
              referrer.balance += bonus;
              referrer.commissionBalance = (referrer.commissionBalance || 0) + bonus;
            }
          }
        }

        const newUser = {
          id: Date.now(),
          username,
          phone,
          password,
          balance: 0.0, // Default balance strictly 0!
          bonusBalance: 0.0,
          commissionBalance: 0.0,
          inviteCode: "DK" + Math.floor(100000 + Math.random() * 900000),
          referredBy: validRef,
          totalDeposited: 0,
          totalWithdrawn: 0,
          totalBetAmount: 0,
          totalWinAmount: 0,
          isBanned: false
        };
        state.users.push(newUser);
        state.currentUserId = newUser.id;
        modalType = null;
        saveState();
        showToast(`স্বাগতম ${username}! একাউন্ট তৈরি হয়েছে (ডিফল্ট ব্যালেন্স ৳0.00)।`);
      },
      loginUser() {
        const idInput = document.getElementById("login-id")?.value?.trim() || "";
        const passInput = document.getElementById("login-pass")?.value?.trim() || "";
        const u = state.users.find(x => x.phone === idInput || x.username.toLowerCase() === idInput.toLowerCase());
        if (!u || u.password !== passInput) {
          showToast("ভুল নাম্বার বা পাসওয়ার্ড!", true);
          return;
        }
        if (u.isBanned) {
          showToast("আপনার একাউন্ট ব্যান করা হয়েছে!", true);
          return;
        }
        state.currentUserId = u.id;
        modalType = null;
        saveState();
        showToast(`স্বাগতম ${u.username}! সফলভাবে লগইন হয়েছে।`);
      },
      logoutUser() {
        state.currentUserId = null;
        saveState();
        showToast("সফলভাবে লগআউট হয়েছে");
      },
      submitDeposit() {
        const u = getCurrentUser();
        if (!u) return;
        const method = document.getElementById("dep-method")?.value || "bkash";
        const amount = parseFloat(document.getElementById("dep-amount")?.value || "0");
        const sender = document.getElementById("dep-sender")?.value?.trim() || "";
        const trxId = document.getElementById("dep-trx")?.value?.trim()?.toUpperCase() || "";

        if (amount < state.settings.minDeposit) {
          showToast(`সর্বনিম্ন ডিপোজিট ৳${state.settings.minDeposit} টাকা!`, true);
          return;
        }
        if (sender.length < 11 || trxId.length < 4) {
          showToast("সঠিক ১১ ডিজিট প্রেরক নাম্বার ও TrxID দিন!", true);
          return;
        }

        const ruleMap = {
          bkash: state.settings.bkashRule,
          nagad: state.settings.nagadRule,
          rocket: state.settings.rocketRule,
          upay: state.settings.upayRule
        };

        state.transactions.unshift({
          id: Date.now(),
          userId: u.id,
          username: u.username,
          phone: u.phone,
          type: "deposit",
          amount,
          method,
          paymentMode: ruleMap[method] || "Send Money",
          accountNumber: sender,
          trxId,
          status: "pending",
          note: state.settings.pendingProcessingNotice
        });
        modalType = null;
        saveState();
        showToast("ডিপোজিট রিকোয়েস্ট পেন্ডিং (Pending) এ জমা হয়েছে! ২-১০ মিনিট অপেক্ষা করুন।");
      },
      submitWithdraw() {
        const u = getCurrentUser();
        if (!u) return;
        const method = document.getElementById("wd-method")?.value || "bkash";
        const amount = parseFloat(document.getElementById("wd-amount")?.value || "0");
        const receiver = document.getElementById("wd-number")?.value?.trim() || "";
        const pass = document.getElementById("wd-pass")?.value?.trim() || "";

        if (u.password !== pass) {
          showToast("আপনার লগইন পাসওয়ার্ড সঠিক নয়!", true);
          return;
        }
        if (amount < state.settings.minWithdraw) {
          showToast(`সর্বনিম্ন উইথড্র ৳${state.settings.minWithdraw} টাকা!`, true);
          return;
        }
        if (u.balance < amount) {
          showToast("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", true);
          return;
        }
        if (receiver.length < 11) {
          showToast("সঠিক ১১ ডিজিটের পার্সোনাল নাম্বার দিন!", true);
          return;
        }

        // Deduct immediately upon request submission so user cannot double-withdraw
        u.balance -= amount;
        state.transactions.unshift({
          id: Date.now(),
          userId: u.id,
          username: u.username,
          phone: u.phone,
          type: "withdraw",
          amount,
          method,
          paymentMode: "Personal",
          accountNumber: receiver,
          trxId: "WD" + String(Date.now()).slice(-6),
          status: "pending",
          note: state.settings.pendingProcessingNotice
        });
        modalType = null;
        saveState();
        showToast("উইথড্র রিকোয়েস্ট পেন্ডিং (Pending) এ জমা হয়েছে! ২-১০ মিনিটের মধ্যে পেমেন্ট পাবেন।");
      },
      placeWingoBet(prediction) {
        const u = getCurrentUser();
        if (!u) {
          modalType = "auth";
          showToast("বেট করতে প্রথমে লগইন করুন!", true);
          return;
        }
        if (wingoRemaining <= 4) {
          showToast("এই রাউন্ড লকড! পরবর্তী রাউন্ডের জন্য অপেক্ষা করুন।", true);
          return;
        }
        const amtInput = parseFloat(document.getElementById("wingo-bet-input")?.value || "10");
        if (amtInput < state.settings.minBet) {
          showToast(`সর্বনিম্ন বেট ৳${state.settings.minBet} টাকা!`, true);
          return;
        }
        if (u.balance < amtInput) {
          modalType = "deposit";
          showToast("পর্যাপ্ত ব্যালেন্স নেই! অনুগ্রহ করে ডিপোজিট করুন।", true);
          return;
        }

        const fee = (amtInput * (Number(state.settings.wingoFeePercent) || 2)) / 100.0;
        const netStake = amtInput - fee;
        u.balance -= amtInput;
        u.totalBetAmount = (u.totalBetAmount || 0) + amtInput;

        // Credit referral bet commission
        if (u.referredBy && state.settings.referralBetCommissionPercent > 0) {
          const refUser = state.users.find(x => x.inviteCode === u.referredBy);
          if (refUser) {
            const comm = (amtInput * state.settings.referralBetCommissionPercent) / 100.0;
            refUser.balance += comm;
            refUser.commissionBalance = (refUser.commissionBalance || 0) + comm;
          }
        }

        state.gameBets.unshift({
          id: Date.now(),
          userId: u.id,
          username: u.username,
          gameType: "wingo",
          betAmount: amtInput,
          feeAmount: fee,
          netStake,
          winAmount: 0,
          multiplier: 0,
          prediction,
          outcome: "",
          status: "pending",
          isWin: false,
          periodNumber: wingoPeriod,
          timerType: state.selectedWingoTimer
        });
        saveState();
        showToast(`বেট সফল: ${prediction.toUpperCase()} (৳${amtInput}) [সার্ভিস ফি: ৳${fee.toFixed(2)}]`);
      },
      playQuickGame(gameType, label, winChancePercent, mult) {
        const u = getCurrentUser();
        if (!u) {
          modalType = "auth";
          showToast("খেলতে প্রথমে লগইন করুন!", true);
          return;
        }
        const amt = parseFloat(document.getElementById("quick-bet-input")?.value || "10");
        if (amt < state.settings.minBet) {
          showToast(`সর্বনিম্ন বেট ৳${state.settings.minBet} টাকা!`, true);
          return;
        }
        if (u.balance < amt) {
          modalType = "deposit";
          showToast("পর্যাপ্ত ব্যালেন্স নেই! রিচার্জ করুন।", true);
          return;
        }
        const fee = (amt * state.settings.wingoFeePercent) / 100.0;
        const net = amt - fee;
        u.balance -= amt;
        u.totalBetAmount = (u.totalBetAmount || 0) + amt;

        const isWin = (Math.random() * 100) < winChancePercent;
        const winAmt = isWin ? net * mult : 0;
        if (isWin) {
          u.balance += winAmt;
          u.totalWinAmount = (u.totalWinAmount || 0) + winAmt;
        }
        state.gameBets.unshift({
          id: Date.now(),
          userId: u.id,
          username: u.username,
          gameType,
          betAmount: amt,
          feeAmount: fee,
          netStake: net,
          winAmount: winAmt,
          multiplier: isWin ? mult : 0,
          prediction: label,
          outcome: isWin ? `WON (${mult}x)` : "LOST",
          status: "settled",
          isWin
        });
        saveState();
        if (isWin) showToast(`অভিনন্দন! আপনি +৳${winAmt.toFixed(0)} (${mult}x) জিতেছেন!`);
        else showToast("দুঃখিত! এবার জিততে পারেননি, আবার চেষ্টা করুন।", true);
      },
      toggleMultiSlip(matchId, matchTitle, pickName, odds) {
        const idx = state.multiBetSlip.findIndex(x => x.matchId === matchId);
        if (idx >= 0) {
          if (state.multiBetSlip[idx].pickName === pickName) state.multiBetSlip.splice(idx, 1);
          else state.multiBetSlip[idx] = { matchId, matchTitle, pickName, odds };
        } else {
          state.multiBetSlip.push({ matchId, matchTitle, pickName, odds });
        }
        saveState();
        render();
      },
      placeMultiSportsBet() {
        const u = getCurrentUser();
        if (!u) {
          modalType = "auth";
          showToast("বেট প্লেস করতে লগইন করুন!", true);
          return;
        }
        if (state.multiBetSlip.length === 0) return;
        const amt = parseFloat(document.getElementById("sports-bet-input")?.value || "50");
        if (u.balance < amt) {
          modalType = "deposit";
          showToast("পর্যাপ্ত ব্যালেন্স নেই!", true);
          return;
        }
        const totalOdds = Number(state.multiBetSlip.reduce((acc, x) => acc * x.odds, 1).toFixed(2));
        const fee = (amt * state.settings.wingoFeePercent) / 100.0;
        const net = amt - fee;
        u.balance -= amt;
        u.totalBetAmount = (u.totalBetAmount || 0) + amt;

        state.gameBets.unshift({
          id: Date.now(),
          userId: u.id,
          username: u.username,
          gameType: "sports_multi",
          betAmount: amt,
          feeAmount: fee,
          netStake: net,
          winAmount: 0,
          multiplier: totalOdds,
          prediction: state.multiBetSlip.map(s => `${s.matchTitle}: ${s.pickName} (@${s.odds})`).join(" + "),
          outcome: "Pending",
          status: "pending",
          isWin: false
        });
        state.multiBetSlip = [];
        saveState();
        showToast(`1xBet মাল্টি স্লিপ সাবমিট হয়েছে! মোট অডস: ${totalOdds}x`);

      },
      // Strictly Idempotent Deposit & Withdraw Processing
      adminProcessTxn(txnId, approve) {
        const txn = state.transactions.find(t => t.id === txnId);
        if (!txn || txn.status !== "pending") {
          showToast("এই রিকোয়েস্টটি ইতিমধ্যে প্রসেস করা হয়েছে! পুনরায় প্রসেস হবে না।", true);
          return;
        }
        const u = state.users.find(x => x.id === txn.userId);
        if (txn.type === "deposit") {
          if (approve) {
            txn.status = "completed";
            const bonus = (txn.amount * state.settings.depositBonusPercent) / 100.0;
            if (u) {
              u.balance += (txn.amount + bonus);
              u.totalDeposited = (u.totalDeposited || 0) + txn.amount;
              if (u.referredBy && state.settings.referralDepositCommissionPercent > 0) {
                const refU = state.users.find(r => r.inviteCode === u.referredBy);
                if (refU) {
                  const comm = (txn.amount * state.settings.referralDepositCommissionPercent) / 100.0;
                  refU.balance += comm;
                  refU.commissionBalance = (refU.commissionBalance || 0) + comm;
                }
              }
            }
            showToast("ডিপোজিট অনুমোদিত হয়েছে এবং ব্যালেন্স যোগ হয়েছে!");
          } else {
            txn.status = "rejected";
            showToast("ডিপোজিট রিকোয়েস্ট বাতিল করা হয়েছে।", true);
          }
        } else if (txn.type === "withdraw") {
          if (approve) {
            // Balance was already deducted on submission. Mark completed ONCE and never add to balance!
            txn.status = "completed";
            if (u) u.totalWithdrawn = (u.totalWithdrawn || 0) + txn.amount;
            showToast("উইথড্র কমপ্লিট (Paid) করা হয়েছে!");
          } else {
            txn.status = "rejected";
            if (u) u.balance += txn.amount;
            showToast("উইথড্র বাতিল করে ইউজারের ব্যালেন্স রিফান্ড করা হয়েছে।", true);
          }
        }
        saveState();
      },
      adminSaveSettings() {
        const s = state.settings;
        s.bkashNumber = document.getElementById("set-bkash")?.value || s.bkashNumber;
        s.bkashRule = document.getElementById("set-bkash-rule")?.value || s.bkashRule;

                <option value="upay">উপায় (Upay)</option>
              </select>
              <input id="dep-amount" type="number" value="${s.minDeposit}" min="${s.minDeposit}" placeholder="ডিপোজিট পরিমাণ (৳)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-amber-400 font-black" />
              <input id="dep-sender" placeholder="আপনার প্রেরক নাম্বার (১১ ডিজিট)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5" />
              <input id="dep-trx" placeholder="ট্রানজেকশন আইডি (TrxID)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 uppercase font-mono" />
              <div class="bg-amber-950/40 border border-amber-500/30 p-2.5 rounded-xl text-[11px] text-amber-300">
                ⏳ ${s.pendingProcessingNotice}
              </div>
              <button onclick="dkAction.submitDeposit()" class="w-full py-3 rounded-xl bg-emerald-500 text-slate-950 font-black">ডিপোজিট রিকোয়েস্ট সাবমিট করুন</button>
            </div>
          </div>
        ` : ""}

        ${modalType === "withdraw" ? `
          <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 w-full max-w-sm space-y-3 text-xs">
              <div class="flex justify-between items-center">
                <span class="font-black text-amber-400 text-sm">উইথড্র রিকোয়েস্ট (মিনিমাম ৳${s.minWithdraw})</span>
                <button onclick="dkAction.closeModal()" class="text-slate-400">✕</button>
              </div>
              <select id="wd-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <option value="bkash">বিকাশ (bKash)</option>
                <option value="nagad">নগদ (Nagad)</option>
                <option value="rocket">রকেট (Rocket)</option>
              </select>
              <input id="wd-amount" type="number" value="${s.minWithdraw}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-amber-400 font-black" />
              <input id="wd-number" placeholder="আপনার পার্সোনাল রিসিভার নাম্বার" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5" />
              <input id="wd-pass" type="password" placeholder="আপনার লগইন পাসওয়ার্ড" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5" />
              <div class="bg-amber-950/40 border border-amber-500/30 p-2.5 rounded-xl text-[11px] text-amber-300">
                ⏳ ${s.pendingProcessingNotice}
              </div>
              <button onclick="dkAction.submitWithdraw()" class="w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-black">উইথড্র সাবমিট করুন</button>
            </div>
          </div>
        ` : ""}

        ${modalType === "chat" ? `
          <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-sky-500/40 rounded-3xl p-5 w-full max-w-sm space-y-3 text-xs">
              <div class="flex justify-between items-center">
                <span class="font-black text-sky-400 text-sm">✈️ অফিশিয়াল টেলিগ্রাম ও লাইভ সাপোর্ট</span>
                <button onclick="dkAction.closeModal()" class="text-slate-400">✕</button>
              </div>
              <div class="bg-sky-950/60 border border-sky-500/40 p-3.5 rounded-2xl space-y-2 text-center">
                <div class="text-slate-300">যেকোনো সাহায্যের জন্য আমাদের টেলিগ্রামে মেসেজ দিন:</div>
                <div class="text-base font-black text-amber-400 font-mono">${s.telegramSupportUsername}</div>
                <a href="https://t.me/${s.telegramSupportUsername.replace('@', '')}" target="_blank" class="block w-full py-2.5 rounded-xl bg-sky-500 text-slate-950 font-black">টেলিগ্রামে সরাসরি কথা বলুন →</a>
              </div>
            </div>
          </div>
        ` : ""}

        ${toastMsg ? `
          <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl font-bold text-xs shadow-2xl ${toastMsg.isError ? 'bg-red-900 text-white border border-red-400' : 'bg-emerald-900 text-white border border-emerald-400'}">
            ${toastMsg.text}
          </div>
        ` : ""}
      `;
    }

    render();
  </script>
</body>
</html>
